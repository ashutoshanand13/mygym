<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FirstRep 3D</title>
  <style>
    body { margin: 0; font: 15px system-ui, sans-serif; background: #eef0f3; color: #151821; }
    header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    header b { margin-right: 8px; }
    button { border: 1px solid #cfd5de; background: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; }
    button.on { background: #2f6fe8; color: #fff; border-color: #2f6fe8; }
    canvas { display: block; width: 100%; height: calc(100vh - 110px); min-height: 320px; cursor: pointer; }
    #status { padding: 0 16px; color: #5d6576; font-size: 13px; }
  </style>
  <script type="importmap">{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }</script>
</head>
<body>
  <header><b>3D preview</b><span id="btns"></span></header>
  <div id="status">Loading 3D model…</div>
  <canvas id="c"></canvas>
  <script src="data.js"></script>
  <script src="anim.js"></script>
  <script type="module">
    import { createViewer } from "./three-fig.js";
    const v = await createViewer(document.getElementById("c"));
    window.viewer = v;
    const btns = document.getElementById("btns");
    const pick = (id) => {
      v.show(id);
      btns.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.id === id));
      document.getElementById("status").textContent = `${EXERCISES[id].name} — red = working muscles · click to pause`;
      location.hash = id;
    };
    Object.keys(ANIM).forEach((id) => {
      const b = document.createElement("button"); b.textContent = EXERCISES[id].name; b.dataset.id = id;
      b.onclick = () => pick(id); btns.append(b);
    });
    document.getElementById("c").onclick = () => v.togglePause();
    pick(location.hash.slice(1) in ANIM ? location.hash.slice(1) : "goblet_squat");
  </script>
</body>
</html>
