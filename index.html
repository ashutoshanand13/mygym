<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <!-- "Add to Home Screen" on iPhone/iPad opens it full-screen like an app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FirstRep">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>FirstRep</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }</script>
</head>
<body>
  <header class="top">
    <div class="brand">🏋️ FirstRep</div>
    <!-- top tabs on desktop/tablet, bottom tab bar on phones -->
    <nav aria-label="Main">
      <a href="#today"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Today</span></a>
      <a href="#plan"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span>Plan</span></a>
      <a href="#exercises"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg><span>Exercises</span></a>
      <a href="#progress"><svg viewBox="0 0 24 24"><path d="M5 20v-8M11 20V5M17 20v-5M3 20h18"/></svg><span>Progress</span></a>
      <a href="#settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg><span>Settings</span></a>
    </nav>
  </header>
  <main id="view"></main>

  <div id="rest" class="rest" hidden>
    <span>Rest</span><b id="rest-time">1:30</b>
    <button id="rest-add" class="ghost">+15s</button><button id="rest-skip" class="ghost">Skip</button>
  </div>
  <div id="toast" class="toast" hidden></div>
  <!-- shared shading for the 3D-style mannequin figures (anim.js) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="g-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f7f9"/><stop offset=".5" stop-color="#c5cbd3"/><stop offset="1" stop-color="#848d9a"/></linearGradient>
    <linearGradient id="g-skin-far" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9ced6"/><stop offset=".5" stop-color="#8f98a4"/><stop offset="1" stop-color="#5f6874"/></linearGradient>
    <linearGradient id="g-mus" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a84"/><stop offset=".5" stop-color="#e2412e"/><stop offset="1" stop-color="#9c2016"/></linearGradient>
    <linearGradient id="g-dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5d636e"/><stop offset=".5" stop-color="#2b2f36"/><stop offset="1" stop-color="#121418"/></linearGradient>
    <linearGradient id="g-metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9aa1ab"/><stop offset=".45" stop-color="#3c414a"/><stop offset="1" stop-color="#16181c"/></linearGradient>
    <linearGradient id="g-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfcfd"/><stop offset="1" stop-color="#e2e6eb"/></linearGradient>
    <linearGradient id="g-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d2d7de"/><stop offset="1" stop-color="#e6e9ed"/></linearGradient>
    <radialGradient id="g-shadow"><stop offset="0" stop-color="#000" stop-opacity=".32"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs></svg>
  <dialog id="modal"><button id="modal-close" class="close" aria-label="Close">✕</button><div id="modal-body"></div></dialog>

  <!-- off-screen home for the 3D canvas; it moves into the guide when one is open -->
  <div id="fig3d-holder" aria-hidden="true"><canvas id="fig3d"></canvas></div>

  <script src="data.js"></script>
  <script src="anim.js"></script>
  <script src="program.js"></script>
  <script src="app.js"></script>
  <script type="module">
    // Load the 3D mannequin; render start/finish thumbnails once, then upgrade the page.
    // If WebGL or the CDN is unavailable, the 2D figures from anim.js stay in place.
    import { createViewer } from "./three-fig.js";
    try {
      const v = await createViewer(document.getElementById("fig3d"));
      const thumbs = {};
      for (const id of Object.keys(ANIM)) { v.show(id); thumbs[id] = [v.snapshot(0), v.snapshot(1)]; }
      v.setActive(false);
      window.FIG3D = { v, thumbs };
      window.dispatchEvent(new Event("fig3d-ready"));
    } catch (e) { console.warn("3D figures unavailable, using 2D", e); }
  </script>
</body>
</html>
