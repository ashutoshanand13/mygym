<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FBX to GLB</title>
  <script type="importmap">{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }</script>
</head>
<body style="font:15px system-ui;padding:20px">
  <h3>Convert models/man.fbx → man.glb (textures ≤ 1024 px)</h3>
  <p id="s">Loading FBX…</p>
  <script type="module">
    // One-off dev tool: Mixamo FBX files are huge (embedded 4K textures) and slow to parse.
    // This re-exports the character as a compact GLB the app can load quickly.
    import * as THREE from "three";
    import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
    import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
    const s = document.getElementById("s");
    const model = await new FBXLoader().loadAsync("../models/man.fbx");
    s.textContent = "Waiting for textures…";
    // TextureLoader fills tex.image asynchronously, so poll until every texture has decoded pixels.
    const texs = [];
    model.traverse((o) => o.isMesh && [].concat(o.material).forEach((m) =>
      ["map", "normalMap", "alphaMap"].forEach((k) => m[k] && texs.push(m[k]))));
    const ready = () => texs.every((t) => t.image && t.image.width > 0);
    for (let i = 0; i < 150 && !ready(); i++) await new Promise((r) => setTimeout(r, 200));
    s.textContent = `Textures: ${texs.filter((t) => t.image?.width).length}/${texs.length} decoded`;
    s.textContent = "Shrinking textures…";
    const MAX = 1024, seen = new Map();
    const shrink = (tex) => {
      if (!tex || !tex.image) return null;
      if (!(tex.image.width > 0)) return null;
      if (seen.has(tex)) return seen.get(tex);
      const img = tex.image, k = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = tex.colorSpace; t.flipY = tex.flipY; t.wrapS = tex.wrapS; t.wrapT = tex.wrapT;
      seen.set(tex, t); return t;
    };
    model.traverse((o) => {
      if (!o.isMesh) return;
      const conv = (m) => {
        const std = new THREE.MeshStandardMaterial({
          name: m.name, color: m.color, map: shrink(m.map), normalMap: shrink(m.normalMap),
          transparent: m.transparent, alphaTest: m.alphaTest || (m.transparent ? 0.3 : 0), side: m.side, roughness: 0.7, metalness: 0
        });
        if (m.alphaMap) std.alphaMap = shrink(m.alphaMap);
        return std;
      };
      o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material);
    });
    s.textContent = "Exporting GLB…";
    const glb = await new GLTFExporter().parseAsync(model, { binary: true, maxTextureSize: MAX });
    const mb = (glb.byteLength / 1048576).toFixed(1);
    try {
      // a local save helper (if running) writes it straight to models/man.glb
      const r = await fetch("http://127.0.0.1:5181/save", { method: "POST", body: glb });
      if (!r.ok) throw new Error(r.status);
      s.textContent = `Done — saved models/man.glb (${mb} MB).`;
    } catch {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([glb], { type: "model/gltf-binary" }));
      a.download = "man.glb"; a.textContent = `Download man.glb (${mb} MB)`;
      s.textContent = "Done — save this file as models/man.glb: "; s.append(a);
    }
  </script>
</body>
</html>
